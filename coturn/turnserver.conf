# duo — coturn config
# Credentials are injected via CLI flags in docker-compose.yml
# This file sets static tunables only.

listening-port=3478
tls-listening-port=5349

fingerprint
lt-cred-mech
use-auth-secret

realm=duo.local

# Relay port range — keep narrow for two-user usage
min-port=49160
max-port=49200

# Hard cap: two relay allocations per peer, four total
total-quota=4
user-quota=2

# Security hardening
no-multicast-peers
no-loopback-peers
no-cli

log-file=stdout
