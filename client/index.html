<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MWAPNET</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #0a0a0a; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Screen system ─────────────────────────────────────────────────── */
    .screen { position: fixed; inset: 0; display: none; }
    .screen.active { display: flex; }

    /* ── Connecting / failed splash ────────────────────────────────────── */
    #screen-connecting,
    #screen-failed,
    #screen-auth {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #0a0a0a;
      z-index: 50;
    }
    .title {
      font-size: 52px; font-weight: 700;
      letter-spacing: -2.5px; line-height: 1;
    }
    .sub {
      font-size: 15px; color: rgba(255,255,255,0.5);
      text-align: center; max-width: 320px; line-height: 1.6;
    }

    /* ── Lobby ──────────────────────────────────────────────────────────── */
    #screen-lobby {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 20px;
      background: #0a0a0a;
      overflow: hidden;
    }
    /* ── Lobby wordmark ─────────────────────────────────────────────────── */
    .lobby-title {
      font-size: 52px; font-weight: 700;
      letter-spacing: -2.5px; line-height: 1;
      position: relative; z-index: 1;

      /* Shimmer: gradient sweeps from left to right through the two
         presence accent tones with bright-white peaks on either side. */
      background: linear-gradient(
        90deg,
        rgba(255,255,255,0.55) 0%,
        #ffffff          15%,
        #d9c5a8          35%,
        #ffffff          50%,
        #b8a8c2          65%,
        #ffffff          82%,
        rgba(255,255,255,0.55) 100%
      );
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;

      /* Entrance (runs once) then hand off to the continuous shimmer */
      animation:
        lobby-title-in 0.7s cubic-bezier(0.16, 1, 0.3, 1) both,
        lobby-shimmer  7s linear 0.7s infinite;
    }

    @keyframes lobby-title-in {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes lobby-shimmer {
      0%   { background-position: 100% 50%; }
      100% { background-position: -200% 50%; }
    }

    /* Background image at 15% opacity, fitted (contain) not cropped (cover) */
    #screen-lobby::before {
      content: '';
      position: absolute; inset: 0;
      #background: url('/backgrounds/lobbybackground.png') center / contain no-repeat;
      opacity: 0.15;
      pointer-events: none;
    }
    .lobby-card {
      width: 100%; max-width: 480px;
      display: flex; flex-direction: column; gap: 16px;
      position: relative; /* stay above the ::before background layer */
    }
    #lobby-preview {
      width: 100%; aspect-ratio: 16 / 9;
      background: #1a1a1a; border-radius: 12px;
      object-fit: contain;
      transform: scaleX(-1); /* mirror — feels natural for self-view */
    }
    .lobby-row {
      display: flex; gap: 12px; align-items: center; justify-content: center;
    }
    #camera-picker {
      flex: 1;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      /* Solid dark bg so the white text is readable in every browser.
         color-scheme: dark tells the browser to render the native dropdown
         popup in dark mode so option text doesn't appear white-on-white. */
      background: #1a1a1a;
      color: #fff; font-size: 14px;
      outline: none;
      color-scheme: dark;
    }
    #camera-picker:focus { border-color: rgba(255,255,255,0.4); }
    #camera-picker option { background: #1a1a1a; color: #fff; }
    .lobby-status {
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.2px;
    }
    /* Presence colours from the design system:
       room  = warm parchment (echoes the door icon)
       lobby = soft mauve (echoes the microphone icon) */
    .lobby-status.peer-room   { color: #d9c5a8; }
    .lobby-status.peer-lobby  { color: #b8a8c2; }

    /* One-shot transition effects — fire only on the specific state changes
       requested (absent→lobby, lobby→room), never on any other transition. */
    @keyframes lobby-status-sparkle {
      0%   { text-shadow: 0 0 0 rgba(184,168,194,0); transform: scale(1); }
      35%  { text-shadow: 0 0 10px rgba(184,168,194,0.9), 0 0 22px rgba(184,168,194,0.5); transform: scale(1.06); }
      100% { text-shadow: 0 0 0 rgba(184,168,194,0); transform: scale(1); }
    }
    .lobby-status.sparkle { animation: lobby-status-sparkle 0.6s ease-out; }

    @keyframes lobby-status-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px); }
      40% { transform: translateX(4px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }
    .lobby-status.shake { animation: lobby-status-shake 0.4s ease-in-out; }

    /* ── Room ───────────────────────────────────────────────────────────── */
    #screen-room { background: #0a0a0a; }
    #screen-room { overflow: hidden; } /* clips the remote feed when zoomed */
    #remote {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain; background: #111;
      /* Zoomable (pinch / ctrl+scroll, transform set in ui.ts) — without
         this, mobile browsers steal the two-finger gesture for page zoom. */
      touch-action: none;
    }
    #remote.hidden { visibility: hidden; }
    #local {
      position: absolute; bottom: 88px; right: 16px;
      /* width is fixed; height comes from aspect-ratio (updated in ui.ts
         once the stream's intrinsic dimensions are known) so the box hugs
         the actual video — no transparent letterbox showing the shadow. */
      width: 144px;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      object-fit: cover;
      cursor: grab; z-index: 10;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      transform: scaleX(-1);
      /* Without this, mobile browsers steal the touch for scrolling
         after only a few pixels of movement, killing the drag. */
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    /* Desktop: restore the larger PiP; mobile keeps the compact 144 wide */
    @media (min-width: 768px) {
      #local { width: 240px; bottom: 96px; }
    }
    #local:active { cursor: grabbing; }
    /* Don't mirror the local view while screensharing — the user wants to read text */
    #local.screen { transform: none; }

    /* ── Screenshare PiP ────────────────────────────────────────────────
       A SEPARATE video element from #local. Same on-screen position and
       sizing, but its srcObject is bound directly to a fresh stream
       wrapping the screen track — so its visibility/playback is entirely
       independent of the camera PiP's logic. */
    #screen-pip {
      position: absolute; bottom: 88px; right: 16px;
      width: 144px;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      object-fit: contain;
      background: #000;
      cursor: grab; z-index: 10;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    @media (min-width: 768px) {
      #screen-pip { width: 240px; bottom: 96px; }
    }
    #screen-pip:active { cursor: grabbing; }
    #screen-pip.hidden { display: none; }

    /* ── Peer screen-share audio control ────────────────────────────────
       Volume slider + mute toggle for the peer's share audio, shown only
       while their share is actually carrying audio. Horizontal above the
       toolbar on desktop and mobile-portrait; vertical on the right edge
       in mobile landscape (where bottom space is scarce). */
    #screen-audio-ctl {
      position: absolute;
      left: 50%; bottom: 92px;
      transform: translateX(-50%);
      display: flex; flex-direction: row; align-items: center; gap: 6px;
      padding: 6px 12px;
      background: rgba(0,0,0,0.5);
      border-radius: 999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 20;
      transition: opacity 0.3s ease; /* fades with the toolbar (ui.ts) */
    }
    #screen-audio-ctl.hidden { display: none; }
    #screen-audio-slider {
      width: 140px;
      accent-color: #b8a8c2;
      touch-action: none;
    }
    @media (orientation: landscape) {
      html:not(.has-hover) #screen-audio-ctl {
        left: auto; right: 12px;
        top: 50%; bottom: auto;
        transform: translateY(-50%);
        flex-direction: column;
        padding: 12px 6px 6px;
      }
      html:not(.has-hover) #screen-audio-slider {
        writing-mode: vertical-lr;
        direction: rtl; /* top = loud, bottom = quiet */
        width: 22px; height: 110px;
      }
    }

    .room-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-size: 17px;
      color: rgba(255,255,255,0.65);
      pointer-events: none;
      letter-spacing: 0.2px;
    }
    .room-overlay.hidden { display: none; }

    .lobby-banner {
      position: absolute;
      top: 12px; left: 50%; transform: translateX(-50%);
      padding: 6px 14px;
      background: rgba(184,168,194,0.16);
      color: #b8a8c2;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.3px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 8;
      white-space: nowrap;
    }
    .lobby-banner.hidden { display: none; }

    /* ── Controls bar (shared between lobby and room) ──────────────────── */
    .controls {
      position: absolute;
      bottom: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 12px;
      padding: 10px 16px;
      background: rgba(0,0,0,0.5);
      border-radius: 999px;
      backdrop-filter: blur(12px);
      z-index: 20;
    }
    #screen-room .controls {
      transition: opacity 0.3s ease;
    }

    .ctrl-btn {
      /* ── ICON BUTTONS ──────────────────────────────────────────────────
         Adjust icon SIZE:        .ctrl-btn .icon  { width / height }
         Adjust button SPACING:   .controls        { gap / padding }
         Adjust button HIT AREA:  .ctrl-btn        { width / height / padding }
         Adjust button POSITION:  .controls        { bottom / left }
      ─────────────────────────────────────────────────────────────────── */
      width: 48px; height: 48px;  /* hit area — kept for finger-friendly tapping */
      border-radius: 0; border: none;
      background: transparent;
      color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.15s, transform 0.1s;
    }
    /* Hover styles only apply when ui.ts has tagged <html> with .has-hover
       (real pointer device). On touch screens the class is never added, so
       these rules never match — no stuck synthetic :hover after a tap.
       CSS `@media (hover: hover)` alone is unreliable: some Android Chrome
       builds report it as true on touch-only devices. */
    html.has-hover .ctrl-btn:hover { opacity: 0.7; transform: scale(1.08); }
    /* Muted / off → dim the icon to 20% so the state is obvious at a glance */
    .ctrl-btn.muted  { opacity: 0.2; }
    /* Active (e.g. screensharing) → blue glow instead of a filled circle */
    .ctrl-btn.active { filter: drop-shadow(0 0 7px rgba(80,160,255,0.95)); opacity: 1; }

    /* ── Icon images ────────────────────────────────────────────────────
       PRIMARY size knob: change the px values below.                    */
    .ctrl-btn .icon {
      width: 36px; height: 36px;  /* ← icon size */
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ── "Enter" ghost pill (icon + text, not a bare icon button) ────── */
    .ctrl-btn.primary {
      width: auto;
      padding: 0 18px;
      height: 48px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      font-size: 15px;
      font-weight: 500;
      background: rgba(255,255,255,0.05); color: #fff;
      gap: 8px;
      opacity: 1;       /* never dim this one */
      transition: background 0.15s, transform 0.1s;
	  font-family: 'Segoe UI';
    }
    html.has-hover .ctrl-btn.primary:hover { background: rgba(255,255,255,0.10); transform: scale(1.03); }
    .ctrl-btn.primary .icon { width: 22px; height: 22px; }  /* ← enter-room icon size */

    /* Flip-camera button is mobile-only — desktop has the camera picker dropdown */
    html.has-hover #room-btn-flip { display: none; }

    /* ── Leave button: tap leaves solo, ~1.2s hold ends the call for both ──
       The fill is a growing red disc behind the icon (document order keeps
       it under the .icon img with no z-index needed); duration must match
       LONG_PRESS_MS in ui.ts. */
    #room-btn-leave { position: relative; border-radius: 50%; }
    #room-btn-leave::before {
      content: '';
      position: absolute; inset: 4px;
      border-radius: 50%;
      background: rgba(255, 59, 48, 0.9);
      transform: scale(0);
      transition: transform 1.2s linear;
    }
    #room-btn-leave.holding::before { transform: scale(1); }
    #room-btn-leave.triggered::before {
      transition: transform 0.1s ease, opacity 0.3s ease 0.1s;
      transform: scale(1.15);
      opacity: 0;
    }

    /* Screenshare is hidden on mobile by default (has-hover is the same
       "real pointer device" signal used above) — Debug Mode is the override,
       toggled via the .debug-mode class on <html> in ui.ts's render(). */
    html:not(.has-hover):not(.debug-mode) #room-btn-screen { display: none; }

    /* ── Auth gate ──────────────────────────────────────────────────────── */
    #key-input-wrap {
      display: flex; flex-direction: column; gap: 10px; width: 280px;
    }
    .key-input {
      width: 100%; padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.07);
      color: #fff; font-size: 14px; font-family: monospace;
      letter-spacing: 1px; outline: none;
    }
    .key-input:focus { border-color: rgba(255,255,255,0.45); }
    .primary-btn {
      width: 100%; padding: 13px;
      border-radius: 10px; border: none;
      background: #fff; color: #000;
      font-size: 15px; font-weight: 600;
      cursor: pointer;
    }
    .primary-btn:hover { opacity: 0.85; }

    /* ── Settings (gear) button + dropdown ─────────────────────────────── */
    .settings-btn {
      position: absolute;
      top: 12px; right: 12px;
      width: 44px; height: 44px;
      border-radius: 999px;
      border: none;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      z-index: 21;
      transition: opacity 0.15s, transform 0.1s;
      padding: 0;
    }
    .settings-btn .icon {
      width: 26px; height: 26px;
      display: block; pointer-events: none;
      user-select: none; -webkit-user-drag: none;
    }
    html.has-hover .settings-btn:hover { opacity: 0.85; transform: scale(1.05); }

    .settings-menu {
      position: absolute;
      top: 64px; right: 12px;
      min-width: 220px;
      padding: 6px;
      background: rgba(15,15,15,0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 22;
      box-shadow: 0 8px 28px rgba(0,0,0,0.55);
    }
    .settings-menu.hidden { display: none; }
    .settings-item {
      width: 100%;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
    }
    html.has-hover .settings-item:hover { background: rgba(255,255,255,0.06); }
    .settings-item .check {
      width: 18px; height: 18px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.35);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .settings-item.on .check {
      background: #fff;
      border-color: #fff;
    }
    .settings-item.on .check::after {
      content: '';
      width: 10px; height: 10px;
      background: #0a0a0a;
      border-radius: 2px;
    }
    .settings-label {
      padding: 10px 12px 2px;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
    }

    /* Lobby's settings button carries a text label ("Settings") next to the
       gear, unlike the room's icon-only one — it opens the full settings
       page directly rather than a dropdown, so it reads more like a button. */
    .settings-btn.labeled {
      width: auto;
      padding: 0 16px 0 12px;
      border-radius: 999px;
      gap: 6px;
    }
    .settings-btn.labeled .icon { width: 22px; height: 22px; }
    .settings-btn.labeled span { font-size: 14px; font-weight: 500; color: #fff; }

    /* ── Full settings page ──────────────────────────────────────────────
       A fixed overlay, NOT a `.screen`/phase. Opening it never touches
       store.phase, so whatever's running underneath (camera, RTC session)
       keeps going untouched — this is deliberately just a layer on top. */
    .settings-page {
      position: fixed; inset: 0;
      background: rgba(10,10,10,0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 40;
      overflow-y: auto;
      padding: 20px 20px 40px;
    }
    .settings-page.hidden { display: none; }
    .settings-page-header {
      display: flex; align-items: center; justify-content: space-between;
      max-width: 480px; margin: 0 auto 24px;
    }
    .settings-page-version {
      font-size: 12px; color: rgba(255,255,255,0.4); letter-spacing: 0.3px;
    }
    .settings-page-close {
      width: 36px; height: 36px;
      background: transparent; border: none; color: #fff;
      font-size: 26px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 999px;
    }
    html.has-hover .settings-page-close:hover { background: rgba(255,255,255,0.08); }
    .settings-page-body {
      max-width: 480px; margin: 0 auto;
      display: flex; flex-direction: column; gap: 28px;
    }
    .settings-section h3 {
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px;
      color: rgba(255,255,255,0.45); font-weight: 600;
      margin-bottom: 10px;
    }
    .settings-section .settings-item { margin-top: 6px; }
    .settings-row {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 0;
    }
    .settings-row-label { flex: 1 1 auto; font-size: 14px; }
    .volume-slider { flex: 1 1 auto; max-width: 140px; accent-color: #b8a8c2; }
    /* Mute icon: dim by default (unmuted, nothing to flag), bright/full
       opacity when muted — the opposite of the mic/cam convention, on
       purpose, since this is a status flag ("audio is off") worth noticing
       rather than a primary feature toggle. */
    .mute-icon-btn {
      width: 32px; height: 32px;
      background: transparent; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0.25;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }
    .mute-icon-btn.on { opacity: 1; }
    .mute-icon-btn img { width: 22px; height: 22px; pointer-events: none; user-select: none; }
    .test-btn {
      flex-shrink: 0;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.05);
      color: #fff; font-size: 12px; cursor: pointer;
      font-family: inherit;
    }
    html.has-hover .test-btn:hover { background: rgba(255,255,255,0.1); }
    .settings-page .key-input { margin: 6px 0 12px; }
    .settings-page .primary-btn { margin-top: 4px; }
    #settings-page-server-url-row.hidden { display: none; }

    /* Desktop mic picker + level meter */
    #mic-input-row.hidden { display: none; }
    .mic-select {
      flex: 1 1 auto; min-width: 0;
      padding: 8px 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      color: #fff; font-family: inherit; font-size: 13px;
    }
    .mic-meter {
      height: 8px; margin: 4px 0 2px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .mic-meter-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #6ad46a, #e6d24a 70%, #e05a4a);
      transition: width 0.06s linear;
    }

    /* Self-PiP visibility — JS toggles .hidden in the room when there's no
       outgoing video (cam off + not screensharing) or the user opted to hide it. */
    #local.hidden { display: none; }

    /* ── Footer (connection-type indicator) ────────────────────────────── */
    #footer {
      position: absolute;
      bottom: 4px; left: 50%; transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      z-index: 5;
      pointer-events: none;
      letter-spacing: 0.3px;
    }
    /* Debug Mode makes the connection-type text impossible to miss */
    html.debug-mode #footer { color: #39ff14; }

    /* ── Tap-to-unmute overlay ─────────────────────────────────────────── */
    #unmute-overlay {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.5); z-index: 25;
      cursor: pointer;
    }
    #unmute-overlay.hidden { display: none; }
    #unmute-overlay span {
      font-size: 17px;
      background: rgba(0,0,0,0.6);
      padding: 12px 24px; border-radius: 8px;
    }

    /* ── Toast (transient status message) ──────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 84px; left: 50%; transform: translateX(-50%);
      max-width: 85vw;
      padding: 10px 18px;
      background: rgba(0,0,0,0.75);
      color: #fff; font-size: 14px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 30;
      pointer-events: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    #toast.hidden { opacity: 0; }
  </style>
</head>
<body>

  <!-- Auth gate (only when no pair key on hand) -->
  <div id="screen-auth" class="screen">
    <span class="title">MWAPNET</span>
    <p class="sub">Paste your pair key to connect.</p>
    <div id="key-input-wrap">
      <input id="key-input" class="key-input" type="password" placeholder="pair key" autocomplete="off" spellcheck="false" />
      <button id="key-submit" class="primary-btn">Connect</button>
    </div>
  </div>

  <!-- Connecting splash -->
  <div id="screen-connecting" class="screen active">
    <span class="title">MWAPNET</span>
    <p class="sub">Connecting…</p>
  </div>

  <!-- Failed splash -->
  <div id="screen-failed" class="screen">
    <span class="title">MWAPNET</span>
    <p id="failed-msg" class="sub"></p>
    <button id="retry-btn" class="primary-btn" style="width:200px">Try Again</button>
  </div>

  <!-- Lobby -->
  <div id="screen-lobby" class="screen">
    <!-- Opens the full settings page directly (no dropdown) — see
         #settings-page near the end of <body>. -->
    <button class="settings-btn labeled" id="lobby-settings-btn" title="Settings" aria-label="Settings"></button>
    <div class="lobby-title">MWAPNET</div>
    <div class="lobby-card">
      <video id="lobby-preview" autoplay playsinline muted></video>
      <div class="lobby-row">
        <select id="camera-picker"></select>
      </div>
      <div class="lobby-row">
        <button class="ctrl-btn" id="lobby-btn-mic" title="Toggle mic"></button>
        <button class="ctrl-btn" id="lobby-btn-cam" title="Toggle camera"></button>
        <button class="ctrl-btn primary" id="lobby-btn-enter">Enter</button>
      </div>
      <p id="lobby-status" class="lobby-status"></p>
    </div>
  </div>

  <!-- Room -->
  <div id="screen-room" class="screen">
    <video id="remote" autoplay playsinline></video>
    <video id="local" autoplay playsinline muted></video>
    <video id="screen-pip" class="hidden" autoplay playsinline muted></video>

    <div id="lobby-banner" class="lobby-banner hidden">MWAP is in the lobby</div>
    <div id="room-overlay" class="room-overlay hidden"></div>

    <button class="settings-btn" id="settings-btn" title="Settings" aria-label="Settings"></button>
    <div id="settings-menu" class="settings-menu hidden" role="menu">
      <button class="settings-item" id="settings-hide-self" role="menuitemcheckbox" aria-checked="false">
        <span>Hide my camera</span>
        <span class="check" aria-hidden="true"></span>
      </button>
      <button class="settings-item" id="settings-exit-meows" role="menuitemcheckbox" aria-checked="false">
        <span>Mute exit meows</span>
        <span class="check" aria-hidden="true"></span>
      </button>
      <button class="settings-item" id="settings-open-page">
        <span>Settings</span>
      </button>
    </div>

    <!-- Peer's screen-share audio: hidden <audio> sink + vertical volume
         slider with a mute toggle. Only shown while their share carries
         audio (see remoteScreenAudioActive). -->
    <audio id="screen-audio" autoplay></audio>
    <div id="screen-audio-ctl" class="hidden">
      <input type="range" id="screen-audio-slider" min="0" max="100" value="100"
             title="Screen share volume" aria-label="Screen share volume" />
      <button class="mute-icon-btn" id="screen-audio-mute"
              title="Mute screen share audio" aria-label="Mute screen share audio"></button>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="room-btn-mic"    title="Toggle mic"></button>
      <button class="ctrl-btn" id="room-btn-cam"    title="Toggle camera"></button>
      <button class="ctrl-btn" id="room-btn-screen" title="Share screen"></button>
      <button class="ctrl-btn" id="room-btn-flip"   title="Flip camera"></button>
      <button class="ctrl-btn danger" id="room-btn-leave" title="Leave room"></button>
    </div>

    <div id="footer"></div>
  </div>

  <!-- Tap-to-unmute (autoplay block fallback) -->
  <div id="unmute-overlay" class="hidden">
    <span>tap to unmute</span>
  </div>

  <!-- Transient status toast -->
  <div id="toast" class="hidden"></div>

  <!-- Full settings page — a fixed overlay, opened from either the lobby's
       labeled button or the room popup's "Settings" item. Not a `.screen`;
       never touches phase, so a call in progress keeps running underneath. -->
  <div id="settings-page" class="settings-page hidden">
    <div class="settings-page-header">
      <div class="settings-page-version">MWAPNET v1.0.0</div>
      <button id="settings-page-close" class="settings-page-close" aria-label="Close settings">&times;</button>
    </div>
    <div class="settings-page-body">
      <section class="settings-section">
        <h3>Audio</h3>
        <!-- Desktop only: choose the mic feeding the call, with a live level
             meter. Revealed by openSettingsPage() when __PLATFORM__==='tauri'. -->
        <div id="mic-input-row" class="hidden">
          <div class="settings-label">Microphone</div>
          <div class="settings-row">
            <select id="mic-input-select" class="mic-select"></select>
            <button class="test-btn" id="mic-test-btn">Test</button>
          </div>
          <div class="mic-meter"><div class="mic-meter-fill" id="mic-meter-fill"></div></div>
        </div>
        <div class="settings-row">
          <span class="settings-row-label">SFX Volume</span>
          <input type="range" id="sfx-volume-slider" class="volume-slider" min="0" max="100" value="100" />
          <button class="mute-icon-btn" id="sfx-mute-btn" title="Mute SFX" aria-label="Mute SFX"></button>
          <button class="test-btn" id="sfx-test-btn">Test</button>
        </div>
        <div class="settings-row">
          <span class="settings-row-label">Vine Boom Volume</span>
          <input type="range" id="vineboom-volume-slider" class="volume-slider" min="0" max="100" value="100" />
          <button class="mute-icon-btn" id="vineboom-mute-btn" title="Mute Vine Boom" aria-label="Mute Vine Boom"></button>
          <button class="test-btn" id="vineboom-test-btn">Test</button>
        </div>
        <button class="settings-item" id="settings-page-exit-meows" role="menuitemcheckbox" aria-checked="false">
          <span>Mute exit meows</span>
          <span class="check" aria-hidden="true"></span>
        </button>
      </section>

      <section class="settings-section">
        <h3>Network</h3>
        <div class="settings-label">Pair key</div>
        <input id="settings-page-key-input" class="key-input" type="password" autocomplete="off" spellcheck="false" />
        <div id="settings-page-server-url-row" class="hidden">
          <div class="settings-label">Server URL</div>
          <input id="settings-page-server-url-input" class="key-input" type="text" autocomplete="off" spellcheck="false" />
        </div>
        <button id="settings-page-key-save" class="primary-btn">Save &amp; reconnect</button>
      </section>

      <section class="settings-section">
        <h3>Debug</h3>
        <button class="settings-item" id="settings-page-debug-mode" role="menuitemcheckbox" aria-checked="false">
          <span>Debug Mode</span>
          <span class="check" aria-hidden="true"></span>
        </button>
      </section>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
