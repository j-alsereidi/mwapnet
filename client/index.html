<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MWAPNET</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #0a0a0a; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Screen system ─────────────────────────────────────────────────── */
    .screen { position: fixed; inset: 0; display: none; }
    .screen.active { display: flex; }

    /* ── Connecting / failed splash ────────────────────────────────────── */
    #screen-connecting,
    #screen-failed,
    #screen-auth {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #0a0a0a;
      z-index: 50;
    }
    .title {
      font-size: 52px; font-weight: 700;
      letter-spacing: -2.5px; line-height: 1;
    }
    .sub {
      font-size: 15px; color: rgba(255,255,255,0.5);
      text-align: center; max-width: 320px; line-height: 1.6;
    }

    /* ── Lobby ──────────────────────────────────────────────────────────── */
    #screen-lobby {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 20px;
      background: #0a0a0a;
      overflow: hidden;
    }
    /* ── Lobby wordmark ─────────────────────────────────────────────────── */
    .lobby-title {
      font-size: 52px; font-weight: 700;
      letter-spacing: -2.5px; line-height: 1;
      position: relative; z-index: 1;

      /* Shimmer: gradient sweeps from left to right through the two
         presence accent tones with bright-white peaks on either side. */
      background: linear-gradient(
        90deg,
        rgba(255,255,255,0.55) 0%,
        #ffffff          15%,
        #d9c5a8          35%,
        #ffffff          50%,
        #b8a8c2          65%,
        #ffffff          82%,
        rgba(255,255,255,0.55) 100%
      );
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;

      /* Entrance (runs once) then hand off to the continuous shimmer */
      animation:
        lobby-title-in 0.7s cubic-bezier(0.16, 1, 0.3, 1) both,
        lobby-shimmer  7s linear 0.7s infinite;
    }

    @keyframes lobby-title-in {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes lobby-shimmer {
      0%   { background-position: 100% 50%; }
      100% { background-position: -200% 50%; }
    }

    /* Background image at 15% opacity, fitted (contain) not cropped (cover) */
    #screen-lobby::before {
      content: '';
      position: absolute; inset: 0;
      #background: url('/backgrounds/lobbybackground.png') center / contain no-repeat;
      opacity: 0.15;
      pointer-events: none;
    }
    .lobby-card {
      width: 100%; max-width: 480px;
      display: flex; flex-direction: column; gap: 16px;
      position: relative; /* stay above the ::before background layer */
    }
    #lobby-preview {
      width: 100%; aspect-ratio: 16 / 9;
      background: #1a1a1a; border-radius: 12px;
      object-fit: contain;
      transform: scaleX(-1); /* mirror — feels natural for self-view */
    }
    .lobby-row {
      display: flex; gap: 12px; align-items: center; justify-content: center;
    }
    #camera-picker {
      flex: 1;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      /* Solid dark bg so the white text is readable in every browser.
         color-scheme: dark tells the browser to render the native dropdown
         popup in dark mode so option text doesn't appear white-on-white. */
      background: #1a1a1a;
      color: #fff; font-size: 14px;
      outline: none;
      color-scheme: dark;
    }
    #camera-picker:focus { border-color: rgba(255,255,255,0.4); }
    #camera-picker option { background: #1a1a1a; color: #fff; }
    .lobby-status {
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.2px;
    }
    /* Presence colours from the design system:
       room  = warm parchment (echoes the door icon)
       lobby = soft mauve (echoes the microphone icon) */
    .lobby-status.peer-room   { color: #d9c5a8; }
    .lobby-status.peer-lobby  { color: #b8a8c2; }

    /* ── Room ───────────────────────────────────────────────────────────── */
    #screen-room { background: #0a0a0a; }
    #remote {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain; background: #111;
    }
    #remote.hidden { visibility: hidden; }
    #local {
      position: absolute; bottom: 88px; right: 16px;
      /* width is fixed; height comes from aspect-ratio (updated in ui.ts
         once the stream's intrinsic dimensions are known) so the box hugs
         the actual video — no transparent letterbox showing the shadow. */
      width: 144px;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      object-fit: cover;
      cursor: grab; z-index: 10;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      transform: scaleX(-1);
      /* Without this, mobile browsers steal the touch for scrolling
         after only a few pixels of movement, killing the drag. */
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    /* Desktop: restore the larger PiP; mobile keeps the compact 144 wide */
    @media (min-width: 768px) {
      #local { width: 240px; bottom: 96px; }
    }
    #local:active { cursor: grabbing; }
    /* Don't mirror the local view while screensharing — the user wants to read text */
    #local.screen { transform: none; }

    .room-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-size: 17px;
      color: rgba(255,255,255,0.65);
      pointer-events: none;
      letter-spacing: 0.2px;
    }
    .room-overlay.hidden { display: none; }

    .lobby-banner {
      position: absolute;
      top: 12px; left: 50%; transform: translateX(-50%);
      padding: 6px 14px;
      background: rgba(184,168,194,0.16);
      color: #b8a8c2;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.3px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 8;
      white-space: nowrap;
    }
    .lobby-banner.hidden { display: none; }

    /* ── Controls bar (shared between lobby and room) ──────────────────── */
    .controls {
      position: absolute;
      bottom: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 12px;
      padding: 10px 16px;
      background: rgba(0,0,0,0.5);
      border-radius: 999px;
      backdrop-filter: blur(12px);
      z-index: 20;
    }
    #screen-room .controls {
      transition: opacity 0.3s ease;
    }

    .ctrl-btn {
      /* ── ICON BUTTONS ──────────────────────────────────────────────────
         Adjust icon SIZE:        .ctrl-btn .icon  { width / height }
         Adjust button SPACING:   .controls        { gap / padding }
         Adjust button HIT AREA:  .ctrl-btn        { width / height / padding }
         Adjust button POSITION:  .controls        { bottom / left }
      ─────────────────────────────────────────────────────────────────── */
      width: 48px; height: 48px;  /* hit area — kept for finger-friendly tapping */
      border-radius: 0; border: none;
      background: transparent;
      color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.15s, transform 0.1s;
    }
    /* Hover styles only apply when ui.ts has tagged <html> with .has-hover
       (real pointer device). On touch screens the class is never added, so
       these rules never match — no stuck synthetic :hover after a tap.
       CSS `@media (hover: hover)` alone is unreliable: some Android Chrome
       builds report it as true on touch-only devices. */
    html.has-hover .ctrl-btn:hover { opacity: 0.7; transform: scale(1.08); }
    /* Muted / off → dim the icon to 20% so the state is obvious at a glance */
    .ctrl-btn.muted  { opacity: 0.2; }
    /* Active (e.g. screensharing) → blue glow instead of a filled circle */
    .ctrl-btn.active { filter: drop-shadow(0 0 7px rgba(80,160,255,0.95)); opacity: 1; }

    /* ── Icon images ────────────────────────────────────────────────────
       PRIMARY size knob: change the px values below.                    */
    .ctrl-btn .icon {
      width: 36px; height: 36px;  /* ← icon size */
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ── "Enter" ghost pill (icon + text, not a bare icon button) ────── */
    .ctrl-btn.primary {
      width: auto;
      padding: 0 18px;
      height: 48px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      font-size: 15px;
      font-weight: 500;
      background: rgba(255,255,255,0.05); color: #fff;
      gap: 8px;
      opacity: 1;       /* never dim this one */
      transition: background 0.15s, transform 0.1s;
	  font-family: 'Segoe UI';
    }
    html.has-hover .ctrl-btn.primary:hover { background: rgba(255,255,255,0.10); transform: scale(1.03); }
    .ctrl-btn.primary .icon { width: 22px; height: 22px; }  /* ← enter-room icon size */

    /* ── Auth gate ──────────────────────────────────────────────────────── */
    #key-input-wrap {
      display: flex; flex-direction: column; gap: 10px; width: 280px;
    }
    #key-input {
      width: 100%; padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.07);
      color: #fff; font-size: 14px; font-family: monospace;
      letter-spacing: 1px; outline: none;
    }
    #key-input:focus { border-color: rgba(255,255,255,0.45); }
    .primary-btn {
      width: 100%; padding: 13px;
      border-radius: 10px; border: none;
      background: #fff; color: #000;
      font-size: 15px; font-weight: 600;
      cursor: pointer;
    }
    .primary-btn:hover { opacity: 0.85; }

    /* ── Footer (connection-type indicator) ────────────────────────────── */
    #footer {
      position: absolute;
      bottom: 4px; left: 50%; transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      z-index: 5;
      pointer-events: none;
      letter-spacing: 0.3px;
    }

    /* ── Tap-to-unmute overlay ─────────────────────────────────────────── */
    #unmute-overlay {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.5); z-index: 25;
      cursor: pointer;
    }
    #unmute-overlay.hidden { display: none; }
    #unmute-overlay span {
      font-size: 17px;
      background: rgba(0,0,0,0.6);
      padding: 12px 24px; border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- Auth gate (only when no pair key on hand) -->
  <div id="screen-auth" class="screen">
    <span class="title">MWAPNET</span>
    <p class="sub">Paste your pair key to connect.</p>
    <div id="key-input-wrap">
      <input id="key-input" type="password" placeholder="pair key" autocomplete="off" spellcheck="false" />
      <button id="key-submit" class="primary-btn">Connect</button>
    </div>
  </div>

  <!-- Connecting splash -->
  <div id="screen-connecting" class="screen active">
    <span class="title">MWAPNET</span>
    <p class="sub">Connecting…</p>
  </div>

  <!-- Failed splash -->
  <div id="screen-failed" class="screen">
    <span class="title">MWAPNET</span>
    <p id="failed-msg" class="sub"></p>
    <button id="retry-btn" class="primary-btn" style="width:200px">Try Again</button>
  </div>

  <!-- Lobby -->
  <div id="screen-lobby" class="screen">
    <div class="lobby-title">MWAPNET</div>
    <div class="lobby-card">
      <video id="lobby-preview" autoplay playsinline muted></video>
      <div class="lobby-row">
        <select id="camera-picker"></select>
      </div>
      <div class="lobby-row">
        <button class="ctrl-btn" id="lobby-btn-mic" title="Toggle mic"></button>
        <button class="ctrl-btn" id="lobby-btn-cam" title="Toggle camera"></button>
        <button class="ctrl-btn primary" id="lobby-btn-enter">Enter</button>
      </div>
      <p id="lobby-status" class="lobby-status"></p>
    </div>
  </div>

  <!-- Room -->
  <div id="screen-room" class="screen">
    <video id="remote" autoplay playsinline></video>
    <video id="local" autoplay playsinline muted></video>

    <div id="lobby-banner" class="lobby-banner hidden">MWAP is in the lobby</div>
    <div id="room-overlay" class="room-overlay hidden"></div>

    <div class="controls">
      <button class="ctrl-btn" id="room-btn-mic"    title="Toggle mic"></button>
      <button class="ctrl-btn" id="room-btn-cam"    title="Toggle camera"></button>
      <button class="ctrl-btn" id="room-btn-screen" title="Share screen"></button>
      <button class="ctrl-btn danger" id="room-btn-leave" title="Leave room"></button>
    </div>

    <div id="footer"></div>
  </div>

  <!-- Tap-to-unmute (autoplay block fallback) -->
  <div id="unmute-overlay" class="hidden">
    <span>tap to unmute</span>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
