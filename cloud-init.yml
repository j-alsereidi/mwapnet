#cloud-config
# Oracle Cloud bootstrap for the duo/MWAPNET app.
# Paste this ONCE into the "Paste cloud-init script" box. Do not paste twice.
# Automates: OS firewall rules (DEPLOY.md step 2B) + Docker install (step 3).
# Still manual after boot: Security List (console), .env, docker compose up.

package_update: true

packages:
  - iptables-persistent
  - git

runcmd:
  # OS firewall: open the ports the app + coturn need
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 443 -j ACCEPT
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 3478 -j ACCEPT
  - iptables -I INPUT 6 -m state --state NEW -p udp --dport 3478 -j ACCEPT
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 5349 -j ACCEPT
  - iptables -I INPUT 6 -m state --state NEW -p udp --dport 49160:49200 -j ACCEPT
  - netfilter-persistent save
  # Docker install
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker ubuntu
  # Marker so you can confirm cloud-init finished: ls ~/cloud-init-done
  - touch /home/ubuntu/cloud-init-done
  - chown ubuntu:ubuntu /home/ubuntu/cloud-init-done

final_message: "duo bootstrap complete. Docker installed, firewall applied. Next: clone repo, set .env, docker compose up -d --build"
