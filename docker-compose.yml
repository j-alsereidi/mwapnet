services:
  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      PORT: "8080"
      PAIR_SECRET_A: "${PAIR_SECRET_A}"
      PAIR_SECRET_B: "${PAIR_SECRET_B}"
      TURN_STATIC_AUTH_SECRET: "${TURN_STATIC_AUTH_SECRET}"
      PUBLIC_TURN_HOST: "${PUBLIC_TURN_HOST}"
      PUBLIC_TURN_PORT: "${PUBLIC_TURN_PORT:-3478}"
      TURNS_TLS_PORT: "${TURNS_TLS_PORT:-5349}"
    restart: unless-stopped
    depends_on:
      - coturn

  coturn:
    image: coturn/coturn:latest
    # host networking is required so coturn can relay media on routable
    # addresses — works on the Oracle Linux VM (unlike Docker Desktop).
    network_mode: host
    command: >
      -n
      --log-file=stdout
      --lt-cred-mech
      --use-auth-secret
      --static-auth-secret=${TURN_STATIC_AUTH_SECRET}
      --realm=${TURN_REALM:-duo.local}
      --listening-port=3478
      --tls-listening-port=5349
      --external-ip=${PUBLIC_TURN_HOST}
      --min-port=49160
      --max-port=49200
      --total-quota=4
      --user-quota=2
      --no-multicast-peers
      --no-cli
      --fingerprint
    restart: unless-stopped
    # NOTE: --no-loopback-peers was removed — modern coturn rejects it and
    # crash-loops (loopback peers are denied by default now; the opt-in flag
    # is --allow-loopback-peers). Confirmed via local validation.

volumes:
  caddy_data:
  caddy_config:
