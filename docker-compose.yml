services:
  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Caddy needs APP_DOMAIN present *inside* the container so the
      # {$APP_DOMAIN} placeholder in the Caddyfile resolves to the real
      # hostname. Without it, {$APP_DOMAIN} expands to empty and Caddy
      # misreads the config as a global-options block.
      APP_DOMAIN: "${APP_DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      PORT: "8080"
      PAIR_SECRET_A: "${PAIR_SECRET_A}"
      PAIR_SECRET_B: "${PAIR_SECRET_B}"
      TURN_STATIC_AUTH_SECRET: "${TURN_STATIC_AUTH_SECRET}"
      PUBLIC_TURN_HOST: "${PUBLIC_TURN_HOST}"
      PUBLIC_TURN_PORT: "${PUBLIC_TURN_PORT:-3478}"
      TURNS_TLS_PORT: "${TURNS_TLS_PORT:-5349}"
    restart: unless-stopped
    depends_on:
      - coturn

  coturn:
    image: coturn/coturn:latest
    # host networking is required so coturn can relay media on routable
    # addresses — works on the Oracle Linux VM (unlike Docker Desktop).
    network_mode: host
    command: >
      -n
      --log-file=stdout
      --lt-cred-mech
      --use-auth-secret
      --static-auth-secret=${TURN_STATIC_AUTH_SECRET}
      --realm=${TURN_REALM:-duo.local}
      --listening-port=3478
      --tls-listening-port=5349
      --external-ip=${PUBLIC_TURN_HOST}/${PRIVATE_TURN_HOST}
      --min-port=49160
      --max-port=49200
      --total-quota=4
      --user-quota=2
      --no-multicast-peers
      --no-cli
      --fingerprint
    restart: unless-stopped
    # NOTE: --no-loopback-peers was removed — modern coturn rejects it and
    # crash-loops (loopback peers are denied by default now; the opt-in flag
    # is --allow-loopback-peers). Confirmed via local validation.
    #
    # NOTE: --external-ip needs public/private pairing (not just the bare
    # public IP) when coturn can see multiple local interfaces, which it does
    # under network_mode: host (VM's real NIC + Docker's bridge interfaces).
    # A bare IP gets rejected as a malformed argument and coturn silently
    # falls back to auto-discovered (private/unreachable) relay addresses.
    # ponytail: PRIVATE_TURN_HOST is a static env var, not auto-detected —
    # fine since Oracle VNIC private IPs don't change on their own. If the
    # VNIC is ever recreated, update PRIVATE_TURN_HOST in .env to match.

volumes:
  caddy_data:
  caddy_config:
