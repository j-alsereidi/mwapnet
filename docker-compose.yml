version: '3.9'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      PAIR_SECRET_A: "${PAIR_SECRET_A}"
      PAIR_SECRET_B: "${PAIR_SECRET_B}"
      TURN_STATIC_AUTH_SECRET: "${TURN_STATIC_AUTH_SECRET}"
      PUBLIC_TURN_HOST: "${PUBLIC_TURN_HOST}"
      PUBLIC_TURN_PORT: "${PUBLIC_TURN_PORT:-3478}"
      TURNS_TLS_PORT: "${TURNS_TLS_PORT:-5349}"
    restart: unless-stopped
    depends_on:
      - coturn

  coturn:
    image: coturn/coturn:latest
    # host networking is required so coturn can relay media on routable addresses
    network_mode: host
    command: >
      -n
      --log-file=stdout
      --lt-cred-mech
      --use-auth-secret
      --static-auth-secret=${TURN_STATIC_AUTH_SECRET}
      --realm=duo.local
      --listening-port=3478
      --tls-listening-port=5349
      --min-port=49160
      --max-port=49200
      --total-quota=4
      --user-quota=2
      --no-multicast-peers
      --no-loopback-peers
      --no-cli
      --fingerprint
    restart: unless-stopped
